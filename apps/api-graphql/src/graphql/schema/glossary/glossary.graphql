"""
Names for a glossary term instance in different languages
"""
type GlossaryTermNames {
  """
  English name/translation
  """
  english: String

  """
  Tibetan name
  """
  tibetan: String

  """
  Sanskrit name
  """
  sanskrit: String

  """
  Pali name
  """
  pali: String

  """
  Chinese name
  """
  chinese: String

  """
  Wylie transliteration
  """
  wylie: String

  """
  Alternative names to the main English name (e.g. synonyms, variant translations)
  """
  alternatives: String
}

"""
A glossary term instance within a specific work
"""
type GlossaryTermInstance {
  """
  Unique identifier
  """
  uuid: ID!

  """
  Authority UUID for the term
  """
  authority: String!

  """
  Definition of the term
  """
  definition: String

  """
  Names in different languages
  """
  names: GlossaryTermNames!

  """
  Absolute position of this term in the work's glossary (1-based)
  """
  termNumber: Int!

  """
  Paginated passage references where this term appears
  """
  passages(
    """
    Number of passages to return (default: all)
    """
    first: Int

    """
    Cursor from previous page's nextCursor (offset-based)
    """
    after: String
  ): GlossaryPassagesPage!
    @deprecated(reason: "Use Query.glossaryTermExcerpts, one term at a time")
}

"""
Paginated passage references for a glossary term
"""
type GlossaryPassagesPage {
  """
  Passages in this page
  """
  items: [Passage!]!

  """
  Cursor for fetching the next page (offset encoded as string), null if no more
  """
  nextCursor: String

  """
  Whether more passages exist beyond this page
  """
  hasMore: Boolean!
}

extend type Query {
  """
  Get a single glossary instance by UUID
  """
  glossaryInstance(
    """
    The glossary instance UUID
    """
    uuid: ID!
  ): GlossaryTermInstance

  """
  Get paginated passage references for a glossary term (per-term, on-demand)
  """
  glossaryTermPassages(
    """
    The glossary term instance UUID
    """
    uuid: ID!

    """
    Number of passages to return per page
    """
    first: Int

    """
    Cursor from previous page's nextCursor (offset-based)
    """
    after: String
  ): GlossaryPassagesPage! @deprecated(reason: "Use glossaryTermExcerpts")

  """
  The passages that cite a glossary term, one per passage in passage order, each
  with an excerpt around the term's first instance. Null when the read fails.
  """
  glossaryTermExcerpts(
    """
    The glossary term UUID
    """
    uuid: ID!

    """
    List only the passages of this Toh and the ones shared by every Toh
    """
    toh: String

    """
    Number of passages per page (default: 20, max: 50)
    """
    first: Int

    """
    Cursor from the previous page's nextCursor
    """
    after: String
  ): GlossaryExcerptsPage

  """
  The glossary-instance annotations that cite a glossary term, one per
  instance, in passage order and then by offset. Draft content only: null for
  a published-content request, or when the read fails.
  """
  glossaryTermInstances(
    """
    The glossary term UUID
    """
    uuid: ID!

    """
    List only the instances in this Toh's passages and the shared ones
    """
    toh: String

    """
    Number of instances per page (default: 50, max: 100)
    """
    first: Int

    """
    Where the page starts among the instances (default: 0)
    """
    offset: Int
  ): GlossaryTermInstancesPage
}

"""
One glossary-instance annotation citing a glossary term, with the text it covers
"""
type GlossaryTermInstanceRow {
  """
  Annotation UUID
  """
  uuid: ID!

  passageUuid: ID!
  passageLabel: String
  passageType: String!
  passageSort: Int!

  """
  Start offset in the passage text, in UTF-16 code units
  """
  start: Int!

  """
  End offset in the passage text, in UTF-16 code units
  """
  end: Int!

  """
  Up to five words of passage text before the instance
  """
  before: String!

  """
  The text the instance covers
  """
  text: String!

  """
  Up to five words of passage text after the instance
  """
  after: String!

  """
  Whether passage text before `before` was left out
  """
  truncatedStart: Boolean!

  """
  Whether passage text after `after` was left out
  """
  truncatedEnd: Boolean!

  """
  The offsets fall outside the passage text, so no text could be cut
  """
  outOfRange: Boolean!
}

"""
A page of the instances that cite a glossary term
"""
type GlossaryTermInstancesPage {
  items: [GlossaryTermInstanceRow!]!

  """
  Number of instances listed for the term across every page
  """
  totalCount: Int!

  """
  Where this page starts among them
  """
  offset: Int!
}

"""
A range of a string, from start up to but not including end, in UTF-16 code units
"""
type TextRange {
  start: Int!
  end: Int!
}

"""
A passage that cites a glossary term, with an excerpt around its first instance
"""
type GlossaryPassageExcerpt {
  """
  Passage UUID
  """
  uuid: ID!

  """
  Passage label
  """
  label: String

  """
  Passage type
  """
  type: String!

  """
  Passage sort order within the work
  """
  sort: Int!

  """
  The Toh the passage belongs to, or null when every Toh shares it
  """
  toh: String

  """
  Number of instances of the term in the whole passage
  """
  instanceCount: Int!

  """
  The excerpt: at most 300 characters of the passage, counting an ellipsis at each cut end
  """
  text: String!

  """
  Whether passage text before the excerpt was left out
  """
  truncatedStart: Boolean!

  """
  Whether passage text after the excerpt was left out
  """
  truncatedEnd: Boolean!

  """
  Where the term's instances fall within text, sorted and not overlapping
  """
  highlights: [TextRange!]!
}

"""
A page of the passages that cite a glossary term
"""
type GlossaryExcerptsPage {
  """
  Passages in this page
  """
  items: [GlossaryPassageExcerpt!]!

  """
  Number of passages listed for the term across every page
  """
  totalCount: Int!

  """
  Cursor for the next page, null if there is none
  """
  nextCursor: String

  """
  Whether more passages follow this page
  """
  hasMore: Boolean!
}

"""
Paginated connection of glossary term instances for a work
"""
type GlossaryTermConnection {
  """
  List of glossary term instances in this page
  """
  nodes: [GlossaryTermInstance!]!

  """
  Pagination information
  """
  pageInfo: PageInfo!

  """
  Total number of glossary terms in this work
  """
  totalCount: Int!
}

extend type Work {
  """
  Glossary term instances for this work
  """
  glossary(
    """
    Include attestation information
    """
    withAttestations: Boolean
  ): [GlossaryTermInstance!]!
    @deprecated(reason: "Use glossaryTerms for paginated access")

  """
  Paginated glossary term instances for this work
  """
  glossaryTerms(
    """
    Cursor for pagination (glossary term UUID)
    """
    cursor: String

    """
    Maximum number of terms to return (default: 50, max: 200)
    """
    limit: Int

    """
    Direction for pagination (default: FORWARD)
    """
    direction: PaginationDirection

    """
    Include attestation information
    """
    withAttestations: Boolean
  ): GlossaryTermConnection!

  """
  Search glossary term instances for this work by English term. Results are ordered by term_number.
  """
  searchGlossaryTerms(
    """
    Search string matched as a prefix against english and alternatives
    """
    query: String!

    """
    Maximum number of terms to return (default: 20, max: 50)
    """
    limit: Int

    """
    Include attestation information
    """
    withAttestations: Boolean
  ): [GlossaryTermInstance!]!
}

"""
A passage whose glossary instances could not be removed
"""
type GlossaryInstanceRemovalFailure {
  """
  The passage, or empty for instances that were not found
  """
  passageUuid: ID!
  passageLabel: String

  """
  The instances asked for in it, none of which were removed
  """
  annotationUuids: [ID!]!
  error: String!
}

"""
Result of removing glossary instances
"""
type RemoveGlossaryTermInstancesResult {
  """
  Instances removed
  """
  removed: [ID!]!

  """
  Passages whose instances stay, with the reason
  """
  failed: [GlossaryInstanceRemovalFailure!]!

  """
  The passages as saved, for an open editor to take in
  """
  passages: [Passage!]!

  """
  Set when nothing was attempted, such as without permission
  """
  error: String
}

extend type Mutation {
  """
  Remove glossary-instance annotations of one glossary term, leaving the
  passage text as it is. Each passage saves on its own, so one that fails keeps
  its instances while the others' removals stand.
  Requires editor.edit permission.
  """
  removeGlossaryTermInstances(
    workUuid: ID!
    termUuid: ID!
    annotationUuids: [ID!]!
  ): RemoveGlossaryTermInstancesResult!
}
