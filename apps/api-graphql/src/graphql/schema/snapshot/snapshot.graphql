"""
A work's draft as a file tree, packed as a tar.gz, cached until the draft changes.
"""
type WorkSnapshot {
  status: WorkSnapshotStatus!

  """
  Identifies one stored archive; it never changes content. Null unless READY.
  """
  snapshotId: String
  workUuid: ID

  """
  The archive's top-level directory: the work's first Toh, else its uuid.
  """
  root: String
  generatedAt: String

  """
  Built from the current draft (as tracked) and not older than a day.
  """
  current: Boolean

  """
  The draft has been edited since this snapshot was built.
  """
  draftChangedSince: Boolean
  ageMinutes: Int

  """
  A newer snapshot is being built.
  """
  refreshing: Boolean

  """
  Compressed size in bytes.
  """
  archiveBytes: Float

  """
  Per-file bytes, lines and sha256, and row counts.
  """
  manifest: JSON

  """
  When GENERATING or FAILED: seconds to wait before asking again.
  """
  retryAfterSeconds: Int
  error: String

  """
  A short-lived download URL for this exact archive. Signed only when selected.
  """
  download: SnapshotDownload
}

enum WorkSnapshotStatus {
  READY
  GENERATING
  FAILED
  NOT_FOUND
}

type SnapshotDownload {
  url: String!
  expiresAt: String!
  filename: String!
}

extend type Mutation {
  """
  The work's draft snapshot, built on first request. A stale one is returned at once
  while a newer one is built. Requires editor.read.
  """
  ensureWorkSnapshot(work: String!): WorkSnapshot!
}

"""
The canon's eText witnesses, from the published build: a catalog archive, and one
text archive per collection.
"""
type EtextsSnapshot {
  status: EtextsSnapshotStatus!
  buildId: String
  builtAt: String

  """
  Every collection key with a text archive in the published build.
  """
  collections: [String!]!

  """
  Compressed size in bytes.
  """
  archiveBytes: Float
  unpackedBytes: Float
  files: Int
  sha256: String
  error: String
  download: SnapshotDownload
}

enum EtextsSnapshotStatus {
  READY
  NOT_FOUND

  """
  Storage could not be read or signed; worth retrying.
  """
  ERROR
}

enum EtextsDataset {
  CATALOG
  TEXT
}

extend type Query {
  """
  A signed download for one archive of the published eText build. `collection` is
  required for TEXT. Requires editor.read.
  """
  etextsSnapshot(dataset: EtextsDataset!, collection: String): EtextsSnapshot!
}
