"""
A comment thread on a passage, or one reply within it.

Carries no text range. The range a comment refers to lives on the
`comment` annotation anchoring it, which is what places a thread on a passage:
a thread's `entityUuid` records where it was born, not where it currently sits.
"""
type Comment {
  """
  Unique identifier for the comment
  """
  uuid: ID!

  """
  The comment body
  """
  content: String!

  """
  Who wrote it
  """
  author: UserInfo!

  """
  When it was written, ISO 8601
  """
  createdAt: String!

  """
  When it was last edited, ISO 8601
  """
  updatedAt: String

  """
  When the thread was resolved, ISO 8601. Set on a thread root only; a reply
  inherits its thread's resolution state rather than carrying its own.
  """
  resolvedAt: String

  """
  Who resolved the thread. Root-only, like `resolvedAt`.
  """
  resolvedBy: UserInfo

  """
  Replies to this comment, oldest first, nested as deep as the read went.
  Empty when this comment has no replies — and also when the read stopped
  here, which `replyCount` distinguishes.
  """
  replies: [Comment!]!

  """
  How many direct replies this comment has. Compare against the length of
  `replies` to tell a leaf from a branch the read truncated: threads are not
  depth-limited in the database, only in any one response.
  """
  replyCount: Int!
}

extend type Query {
  """
  One thread addressed by any comment in it, with replies nested from that
  comment down. How a client opens a branch that a shallower read truncated.

  Null for a `published` content source, and for a uuid that names no comment.
  """
  comment(
    """
    The comment to read from — a thread root, or any reply within it
    """
    uuid: ID!

    """
    How many levels of replies to nest below it
    """
    depth: Int
  ): Comment
}

extend type Passage {
  """
  Comment threads anchored in this passage, oldest first. Roots only, with
  replies nested under `replies`; a flat list plus a parent id would push tree
  assembly into every client.

  Found through the passage's `comment` annotations rather than through
  `comments.entity_uuid`, so a thread appears where its anchor currently is
  rather than where the thread was first written. A thread whose anchor was
  deleted is absent here and reachable only by work scope.

  Always empty for a `published` content source: comments are draft-only, so
  there is nothing to find and no query is issued.
  """
  comments: [Comment!]!

  """
  Comment threads in this passage's scope that no `comment` annotation points
  at any more, oldest first. Roots only, replies nested as in `comments`.

  The complement of `comments`, and disjoint from it: a thread with no anchor
  has no position, so nothing that resolves position can reach it. Removing a
  mark deletes only the anchor, and a client serialization gap can drop one as
  easily as a deliberate unmark, so these stay readable and replyable rather
  than disappearing.

  Scope is where a thread was born. An anchor that moved to another passage
  still counts, so a thread is reported here only when no annotation anywhere
  names it.

  Always empty for a `published` content source.
  """
  unanchoredComments: [Comment!]!
}

"""
What a client sends to start a thread. A reply carries no scope of its own —
`replyToComment` inherits its parent's, so a reply cannot be filed under an
entity its thread does not belong to.
"""
input CreateCommentInput {
  """
  The entity the thread hangs off — a passage uuid today
  """
  entityUuid: ID!

  """
  What kind of entity that is. Only `passage` is accepted.
  """
  entityType: String!

  """
  The comment body
  """
  content: String!
}

"""
The outcome of a comment write. `comment` carries the saved row so a client can
update a thread without refetching it. Null on failure — and, rarely, on a
success whose read-back failed, which a client answers by refetching.
"""
type CommentResult {
  success: Boolean!
  comment: Comment
  error: String
}

"""
The outcome of a comment delete. `deletedUuids` names the target together with
every reply that cascaded with it, so a client can drop them all at once.
"""
type DeleteCommentResult {
  success: Boolean!
  deletedUuids: [ID!]!
  error: String
}

extend type Mutation {
  """
  Start a thread on an entity.
  Requires editor.edit permission.
  """
  createComment(input: CreateCommentInput!): CommentResult!

  """
  Reply to a comment. Scope is inherited from the parent.
  Requires editor.edit permission.
  """
  replyToComment(parentUuid: ID!, content: String!): CommentResult!

  """
  Edit a comment's body. The author only.
  Requires editor.edit permission.
  """
  updateComment(uuid: ID!, content: String!): CommentResult!

  """
  Resolve or un-resolve a thread, addressed by its root. Any editor may.
  Requires editor.edit permission.
  """
  resolveComment(uuid: ID!, resolved: Boolean!): CommentResult!

  """
  Delete a comment and every reply below it. The author only.

  Leaves the `comment` annotation anchoring the thread in place — the editor
  removes that mark through a normal passage save.
  Requires editor.edit permission.
  """
  deleteComment(uuid: ID!): DeleteCommentResult!
}
